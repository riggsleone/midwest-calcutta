name: Build the board

on:
  # Every twenty minutes. The job checks the schedule first, which is small,
  # and stops right there unless a game is in progress or a week has just
  # finished. So most of these runs cost a few seconds and change nothing.
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season"
        default: "2026"
        required: true
      force:
        description: "Allow a settled week to change (only after reviewing why)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-the-board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Build board.json
        shell: bash
        env:
          CALCUTTA_FORCE: ${{ inputs.force == true && '1' || '0' }}
        run: |
          set -o pipefail
          cd pipeline
          python build.py "${{ inputs.season || '2026' }}" 2>&1 | tee build_report.txt

      - name: Show the report
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat pipeline/build_report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit the data if it changed
        run: |
          git config user.name  "calcutta-bot"
          git config user.email "calcutta-bot@users.noreply.github.com"
          git add data/board.json data/games.json
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "board: season ${{ inputs.season || '2026' }} refresh"
            git push
          fi
