<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2026 Midwest+ Calcutta</title>
<meta name="description" content="Live prize board for the 2026 Midwest+ NFL Calcutta.">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-title" content="Calcutta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5F7F9; --card:#FFFFFF; --raise:#FFFFFF; --line:#E1E6EB; --line2:#EDF0F3;
  --tx:#0E1519; --dim:#606D79; --faint:#8896A2;
  --acc:#0E9B63; --acc-soft:#0E9B631f;
  --live:#B7791F; --live-soft:#B7791F1f;
  --cool:#2563A8;
  --shadow:0 1px 2px rgba(16,24,32,.06);
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0D10; --card:#141A20; --raise:#1A222A; --line:#242D36; --line2:#1B232B;
    --tx:#E6EDF3; --dim:#93A1AE; --faint:#6C7B89;
    --acc:#19C37D; --acc-soft:#19C37d1f;
    --live:#F2B33D; --live-soft:#F2B33D1f;
    --cool:#5AA2E8;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0D10; --card:#141A20; --raise:#1A222A; --line:#242D36; --line2:#1B232B;
  --tx:#E6EDF3; --dim:#93A1AE; --faint:#6C7B89;
  --acc:#19C37D; --acc-soft:#19C37d1f;
  --live:#F2B33D; --live-soft:#F2B33D1f;
  --cool:#5AA2E8;
  --shadow:none;
}

*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

#app{max-width:452px;margin:0 auto;min-height:100vh;background:var(--bg);
  display:flex;flex-direction:column;position:relative;}
@media(min-width:453px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line);}}

/* ---------------------------------------------------------------- notice */
.notice{background:var(--live-soft);border-bottom:1px solid var(--line);
  padding:9px 16px;font-size:11.5px;color:var(--tx);line-height:1.4;}
.notice b{color:var(--live);font-weight:600;letter-spacing:.03em;text-transform:uppercase;font-size:10.5px;}

/* ---------------------------------------------------------------- header */
header{position:sticky;top:0;z-index:20;background:var(--card);
  border-bottom:1px solid var(--line);}
.hrow{display:flex;align-items:center;justify-content:space-between;padding:11px 16px 9px;}
.brand{font-weight:700;font-size:14.5px;letter-spacing:-.015em;display:flex;align-items:center;gap:8px;}
.brand .logo{width:27px;height:27px;border-radius:6px;flex:none;overflow:hidden;
  box-shadow:0 0 0 1px rgba(16,24,32,.08);}
.brand .logo img{width:100%;height:100%;object-fit:cover;display:block;}
.stamp{font-family:var(--mono);font-size:10px;color:var(--faint);text-align:right;line-height:1.35;}

/* pot bar */
.pot{padding:0 16px 12px;}
.potlabel{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.potlabel .l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;}
.potlabel .r{font-family:var(--mono);font-size:12px;color:var(--dim);}
.potlabel .r b{color:var(--tx);font-weight:600;}
.track{height:9px;border-radius:5px;background:var(--line2);overflow:hidden;display:flex;
  border:1px solid var(--line);}
.seg{height:100%;}
.seg.a{background:var(--acc);}
.seg.b{background:var(--live);}
.legend{display:flex;gap:14px;margin-top:7px;flex-wrap:wrap;}
.lg{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim);}
.lg i{width:7px;height:7px;border-radius:2px;display:inline-block;}
.lg b{font-family:var(--mono);color:var(--tx);font-weight:600;font-size:11px;}

/* ---------------------------------------------------------------- tabs */
nav{position:sticky;bottom:0;z-index:20;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
nav button{flex:1;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;color:var(--faint);font-weight:500;border-top:2px solid transparent;margin-top:-1px;}
nav button[aria-selected="true"]{color:var(--acc);border-top-color:var(--acc);}
nav svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;}

main{flex:1;padding-bottom:6px;}
.panel{display:none;}
.panel.on{display:block;}

/* ---------------------------------------------------------------- bits */
.sec{padding:14px 16px 6px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.sec h2{margin:0;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);font-weight:600;}
.sec .note{font-size:11px;color:var(--faint);font-family:var(--mono);}

.list{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.row{display:flex;align-items:center;gap:11px;padding:10px 16px;
  border-bottom:1px solid var(--line2);width:100%;text-align:left;}
.row:last-child{border-bottom:0;}
.row .rank{font-family:var(--mono);font-size:12px;color:var(--faint);width:16px;flex:none;
  font-weight:500;text-align:right;}
.row .main{flex:1;min-width:0;}
.row .nm{font-weight:600;font-size:14px;letter-spacing:-.005em;}
.row .sub{font-size:11.5px;color:var(--dim);margin-top:2px;}
.row .amt{font-family:var(--mono);font-weight:600;font-size:15px;
  font-variant-numeric:tabular-nums;flex:none;text-align:right;}
.row .amt.g{color:var(--acc);}
.row .amt small{display:block;font-size:10px;font-weight:400;color:var(--faint);
  margin-top:1px;letter-spacing:.02em;}

/* recovery meter */
.row .nm,.row .sub{display:block;}
.meter{display:block;height:3px;border-radius:2px;background:var(--line2);
  margin-top:6px;overflow:hidden;max-width:180px;}
.meter i{display:block;height:100%;background:var(--acc);border-radius:2px;}
.wl{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11.5px;color:var(--dim);}
.wl b{color:var(--tx);font-weight:600;}
.wl .amt2{font-family:var(--mono);font-size:11px;color:var(--acc);font-weight:600;}
.shared{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--live);
  font-weight:600;margin-top:3px;display:block;}

/* chips */
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;}
/* one width for every chip, so two- and three-letter abbreviations line up */
.chip{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.03em;
  min-width:30px;height:16px;border-radius:3px;line-height:1;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;flex:none;}
.names .chip{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:0;
  background:none!important;color:var(--dim)!important;padding:2.5px 0;
  border-right:1px solid var(--line);padding-right:7px;margin-right:3px;}
.names .chip:last-child{border-right:0;}

/* pills / segmented */
.segbar{display:flex;gap:6px;padding:10px 16px 4px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;}
.segbar::-webkit-scrollbar{display:none;}
.pill{padding:5px 11px;border-radius:999px;font-size:12px;font-weight:500;
  border:1px solid var(--line);color:var(--dim);white-space:nowrap;background:var(--card);}
.pill[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#05130D;font-weight:600;}
.pill.mini{padding:4px 9px;font-size:11px;font-family:var(--mono);}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;padding:2.5px 6px;border-radius:3px;}
.tag.final{background:var(--acc-soft);color:var(--acc);}
.tag.live{background:var(--live-soft);color:var(--live);}

/* stat block */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.stat{background:var(--card);padding:12px 16px;}
.stat .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;}
.stat .v{font-family:var(--mono);font-size:21px;font-weight:600;margin-top:3px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.stat .v.g{color:var(--acc);}
.stat .x{font-size:11px;color:var(--dim);margin-top:2px;}

/* split bar */
.split{padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);}
.sbar{height:8px;border-radius:4px;overflow:hidden;display:flex;background:var(--line2);}
.sbar i{height:100%;}
.skey{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;}
.skey span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);}
.skey em{width:7px;height:7px;border-radius:2px;font-style:normal;}
.skey b{font-family:var(--mono);color:var(--tx);font-weight:600;}

table{width:100%;border-collapse:collapse;font-size:13px;}
.tw{overflow-x:auto;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
th{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
  font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
th:first-child,td:first-child{text-align:left;padding-left:16px;}
th:last-child,td:last-child{padding-right:16px;}
td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap;}
tr:last-child td{border-bottom:0;}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;}
td.g{color:var(--acc);font-weight:600;}
th.s{cursor:pointer;color:var(--dim);}
th.s[data-on="1"]{color:var(--acc);}

.empty{padding:26px 16px;text-align:center;color:var(--faint);font-size:12.5px;}
.foot{padding:16px;font-size:11px;color:var(--faint);line-height:1.55;}
.foot b{color:var(--dim);font-weight:600;}

/* settings */
.setrow{display:flex;gap:8px;padding:10px 16px 12px;align-items:center;flex-wrap:wrap;
  border-bottom:1px solid var(--line);background:var(--card);}
.setrow .lb{font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);font-weight:600;margin-right:2px;}
.grp{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.grp button{padding:4px 9px;font-size:11.5px;color:var(--dim);border-right:1px solid var(--line);}
.grp button:last-child{border-right:0;}
.grp button[aria-pressed="true"]{background:var(--raise);color:var(--tx);font-weight:600;}

/* the page holds still until the board is in hand */
#app{display:none;}
#boot{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.bootmsg{max-width:340px;text-align:center;}
.bootmsg h1{font-size:16px;font-weight:600;margin:0 0 8px;}
.bootmsg p{margin:0 0 8px;font-size:13px;color:var(--dim);line-height:1.5;}
.bootmsg p.q{color:var(--faint);font-size:12px;}
.bootmsg code{font-family:var(--mono);font-size:11.5px;color:var(--tx);}
/* room for a two-character place like T4 without crowding the name */
.row .rank{width:21px;}
/* a playoff round is named, not numbered, so its tag needs a little more room */
.row .rank.wide{width:30px;font-size:9.5px;letter-spacing:.02em;font-weight:600;}
.spin{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);
  border-top-color:var(--acc);margin:0 auto 14px;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>

const $ = s => document.querySelector(s);

/* every amount in the data is integer cents. Whole dollars print clean; a split
   prize prints its cents, because that is the point of splitting to the cent. */
const money = c => {
  const v = c/100;
  return '$' + (Number.isInteger(v)
    ? v.toLocaleString('en-US')
    : v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}));

/* ---------------------------------------------------------------- globals */
let DATA = null, LIVE = null, PRE = false, ZERO = true, TEAM = {}, OWNERS = [], M = {};

const state = {
  tab: 'stand',
  me: null,                // set on first load to whoever leads
  week: 1,
  prize: null,
  prizeMode: 'awarded',
  sort: 'price'
};

/* the seven weekly prizes, in the order the rule book lists them */
const ORDER7 = ['Team of the Week','Stinker of the Week','Price Check',
                'Upset of the Week','Shootout','Most Field Goals','Longest TD'];

/* The schedule numbers the playoff rounds 19 to 22, but nobody calls the
   Super Bowl "Week 22", and the seven weekly prizes stop at Week 18. So the
   ribbon shows rounds by name from there on. */
const ROUND = {19:['WC','Wild Card'], 20:['DIV','Divisional'],
               21:['CONF','Conference'], 22:['SB','Super Bowl']};
const REG_WEEKS = 18;
const isPost  = n => n > REG_WEEKS;
const wkPill  = n => isPost(n) ? ROUND[n][0] : 'W' + n;
const wkName  = n => isPost(n) ? ROUND[n][1] : 'Week ' + n;
const wkTag   = n => isPost(n) ? ROUND[n][0] : String(n);
const rankCell= n => `<span class="rank${isPost(n)?' wide':''}">${wkTag(n)}</span>`;
const wkThru  = n => n === 0 ? 'Before Week 1'
                  : isPost(n) ? (n === 22 ? 'Season complete' : 'Through the ' + ROUND[n][1])
                  : 'Through Week ' + n;

/* ---------------------------------------------------------------- chips */
/* Chips carry both team colours: primary as the ground, secondary as a hairline
   outline. Lettering stays plain black or white, so all 32 read cleanly. */
function lum(hex){
  const h = hex.replace('#','');
  const [r,g,b] = [0,2,4].map(i => parseInt(h.slice(i,i+2),16)/255);
  const f = c => c<=.03928 ? c/12.92 : Math.pow((c+.055)/1.055, 2.4);
  return .2126*f(r) + .7152*f(g) + .0722*f(b);
}
const chipInk = t => lum(t.c1) > .36 ? '#0B0D10' : '#FFFFFF';
function chipHTML(abbr){
  const t = TEAM[abbr];
  if (!t) return `<span class="chip" style="background:var(--line2);color:var(--dim)">${esc(abbr)}</span>`;
  return `<span class="chip" style="background:${t.c1};color:${chipInk(t)}${
    t.c2 ? `;box-shadow:inset 0 0 0 1px ${t.c2}` : ''}">${abbr}</span>`;
}
const chipsFor = list => `<div class="chips">${list.map(chipHTML).join('')}</div>`;

/* one line per winning team, so a shared prize shows who won it and why */
function winnerLines(l, showAmt){
  return l.winners.map(w=>`<span class="wl">${w.abbr?chipHTML(w.abbr):''}
    <b>${esc(w.owner || 'no owner')}</b>${showAmt&&(l.split||l.perTeam)?`<span class="amt2">${money(w.amount)}</span>`:''}
    <span>${esc(w.detail||l.detail)}</span></span>`).join('');
}

/* ---------------------------------------------------------------- header */
/* the next kickoff, in the reader's own time zone */
function kickText(iso){
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const day = d.toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'});
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2,'0');
  const ap = h < 12 ? 'a' : 'p';
  h = h % 12 || 12;
  return `${day}, ${h}:${m}${ap}`;
}

function stampTime(iso){
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const day = d.toLocaleDateString('en-US',{weekday:'short'});
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2,'0');
  const ap = h < 12 ? 'a' : 'p';
  h = h % 12 || 12;
  return `${day} ${h}:${m}${ap}`;
}

function drawHeader(){
  /* No banner, ever. It was there to say "this is a prototype", and it is not
     one any more. Everything it carried is said where it belongs instead: the
     header stamp shows live or through-week, and the This Week panel says
     nothing pays until the last game is final. */
  $('#notice').style.display = 'none';

  $('#stamp').innerHTML = PRE
    ? (DATA.nextKick ? `Week 1 kicks off<br>${kickText(DATA.nextKick)}` : `Season starts<br>Week 1`)
    : (DATA.isLive && LIVE)
    ? `<span style="color:var(--live);font-weight:600">${esc(wkName(LIVE.week))} live</span><br>Updated ${stampTime(DATA.generated)}`
    : `${wkThru(DATA.throughWeek)}<br>Updated ${stampTime(DATA.generated)}`;

  $('#potPct').textContent = money(M.awarded);
  $('#segA').style.width = (M.awarded/M.pot*100).toFixed(2)+'%';
  $('#segB').style.width = (M.inPlay/M.pot*100).toFixed(2)+'%';
  $('#lgA').textContent = money(M.awarded);
  $('#lgB').textContent = money(M.inPlay);
  $('#lgC').textContent = money(M.stillToCome);
  const lgB = $('#lgB').closest('.lg');
  lgB.style.display = M.inPlay ? '' : 'none';   // nothing is live on a Tuesday
}

/* ---------------------------------------------------------------- standings */
function standings(){
  const rows = [...DATA.owners].sort(ZERO
    ? (a,b)=>a.name.localeCompare(b.name)     // nobody leads yet
    : (a,b)=>b.won-a.won || a.name.localeCompare(b.name));

  /* Standard competition ranking, the way every sport does it: everyone level
     shares the same place and the next place skips over them. Four owners tied
     on the same money are all 4th, and the next owner is 8th, not 5th. Early
     in the season, when a week only moves $38 around, ties will be common. */
  const place = [];
  let cur = 0, prev = null;
  rows.forEach((o, i) => {
    if (o.won !== prev) { cur = i + 1; prev = o.won; }
    place.push(cur);
  });
  const shared = {};
  place.forEach(v => shared[v] = (shared[v] || 0) + 1);
  const rankText = i => shared[place[i]] > 1 ? 'T' + place[i] : String(place[i]);

  return `
  <div class="sec"><h2>Standings</h2><span class="note">${PRE ? "Before Week 1" : wkThru(DATA.throughWeek)}</span></div>
  <div class="list">` + rows.map((o,i)=>{
    const pct = Math.round(o.won / M.buyIn * 100);
    return `<button class="row" data-goowner="${esc(o.name)}">
      <span class="rank">${ZERO ? '' : rankText(i)}</span>
      <span class="main">
        <span class="nm">${esc(o.name)}</span>
        ${chipsFor(o.teams)}
        <span class="meter"><i style="width:${Math.min(100,pct)}%"></i></span>
      </span>
      <span class="amt g">${money(o.won)}<small>${pct}% of buy-in</small></span>
    </button>`;
  }).join('') + `</div>
  <div class="foot">${ZERO ? 'Listed alphabetically, because nobody has won anything yet. Once the first week is final this ranks on winnings to date (John Math).' : 'Ranked on winnings to date (John Math). A <b>T</b> means level on the money, and everyone level shares the place.'} The buy-in shows as the share recovered rather than a net total. <b>The full net settlement appears once, after the Super Bowl.</b></div>`;
}

/* ---------------------------------------------------------------- owner */
function ownerPanel(){
  const me = state.me;
  const o = DATA.owners.find(x=>x.name===me) || DATA.owners[0];
  const c = DATA.cat[o.name];
  const pct = Math.round(o.won / M.buyIn * 100);
  const mine = DATA.teams.filter(t=>t.owner===o.name).sort((a,b)=>b.price-a.price);
  const wins = DATA.ledger.filter(l=>l.winners.some(w=>w.owner===o.name && w.amount>0))
                 .sort((a,b)=>b.week-a.week || a.prize.localeCompare(b.prize));
  const CATS = [['weekly','Weekly',  'var(--acc)'],
                ['bounty','Bounty',  'var(--cool)'],
                ['mini',  'Mini-season','var(--live)'],
                ['novelty','Novelty','#9B7BD4'],
                ['post',  'Postseason','#4C5A66']];
  const tot = Math.max(1,o.won);
  const order = [...DATA.owners].sort(ZERO
    ? (a,b)=>a.name.localeCompare(b.name)
    : (a,b)=>b.won-a.won || a.name.localeCompare(b.name));

  return `
  <div class="segbar">${order.map(x=>
    `<button class="pill" data-owner="${esc(x.name)}" aria-pressed="${x.name===o.name}">${esc(x.name)}</button>`).join('')}</div>

  <div class="stats">
    <div class="stat"><div class="k">Won to date</div><div class="v g">${money(o.won)}</div>
      <div class="x">${pct}% of the ${money(M.buyIn)} buy-in back</div></div>
    <div class="stat"><div class="k">Teams held</div><div class="v">${o.teams.length}</div>
      <div class="x">${money(o.spent)} spent at auction</div></div>
  </div>

  ${o.won ? `<div class="split">
    <div class="sbar">${CATS.map(([k,,col])=>
      c[k] ? `<i style="width:${c[k]/tot*100}%;background:${col}"></i>` : '').join('')}</div>
    <div class="skey">${CATS.filter(([k])=>c[k]).map(([k,l,col])=>
      `<span><em style="background:${col}"></em>${l} <b>${money(c[k])}</b></span>`).join('')}</div>
  </div>` : ''}

  <div class="sec"><h2>Roster</h2><span class="note">${o.teams.length} teams</span></div>
  <div class="list">${mine.map(t=>`
    <div class="row">
      <span class="main">
        <span class="nm" style="font-size:13.5px">${chipHTML(t.abbr)} &nbsp;${esc(t.name)}</span>
        <span class="sub">${t.w}-${t.l}${t.t?'-'+t.t:''} &nbsp;·&nbsp; paid ${money(t.price)} &nbsp;·&nbsp; ${t.pf-t.pa>0?'+':''}${t.pf-t.pa} diff</span>
      </span>
      <span class="amt ${t.earned?'g':''}">${money(t.earned)}<small>earned</small></span>
    </div>`).join('')}</div>

  <div class="sec"><h2>Every win</h2><span class="note">${wins.length} so far</span></div>
  <div class="list">${wins.length ? wins.map(l=>{
    const w = l.winners.filter(x=>x.owner===o.name && x.amount>0);
    const amt = w.reduce((s,x)=>s+x.amount,0);
    return `<div class="row">
      ${rankCell(l.week)}
      <span class="main"><span class="nm" style="font-size:13px">${esc(l.prize)}${l.split?' <span style="color:var(--live);font-weight:500;font-size:11px">shared</span>':''}</span>
      <span class="sub">${w.map(x=>(x.abbr?chipHTML(x.abbr)+' ':'')+esc(x.detail||l.detail)).join('<br>')}</span></span>
      <span class="amt g">${money(amt)}</span></div>`;
  }).join('') : `<div class="empty">${PRE ? 'The season has not started.' : 'Nothing yet. It is a long season.'}</div>`}</div>
  <div class="foot">Earned is everything a team has brought in: weekly prizes plus ${money(100)} for every win. Mini-season and novelty prizes are won by an owner rather than a team, so they show above but not against any one team.</div>`;
}

/* ---------------------------------------------------------------- this week */
function weekPanel(){
  if (PRE) return `
    <div class="sec"><h2>This week</h2><span class="note">Week 1</span></div>
    <div class="list"><div class="empty">${DATA.nextKick
      ? `Week 1 kicks off ${esc(kickText(DATA.nextKick))}.` : 'Week 1 has not kicked off.'}<br>
      Seven prizes go live the moment it does.</div></div>
    <div class="foot">Once games start, this page shows the current leader for each of the seven weekly prizes and updates as results come in. Nothing is paid until every game in the week is final.</div>`;

  const w = state.week;
  const live = DATA.isLive && LIVE && w === LIVE.week;
  const wk = DATA.ledger.filter(l=>l.week===w && ORDER7.includes(l.prize));
  const total = wk.reduce((s,l)=>s+l.amount,0);
  const last = (DATA.isLive && LIVE) ? LIVE.week : DATA.throughWeek;

  /* Regular weeks up to wherever we are, then any playoff round the bracket
     has actually produced. Before the bracket is set there are no round pills
     to show, which is correct: those games do not exist yet. */
  const weeks = [];
  for (let i = 1; i <= Math.min(last, REG_WEEKS); i++) weeks.push(i);
  (DATA.post || []).forEach(r => { if (r.week <= last) weeks.push(r.week); });

  const rd = (DATA.post || []).find(r => r.week === w);
  const head = `
  <div class="segbar">${weeks.map(i=>
    `<button class="pill mini" data-week="${i}" aria-pressed="${i===w}">${wkPill(i)}</button>`).join('')}</div>
  <div class="sec"><h2>${esc(wkName(w))}</h2>
    <span>${live
      ? `<span class="tag live">Live · ${LIVE.gamesFinal} of ${LIVE.gamesTotal} final</span>`
      : '<span class="tag final">Final</span>'}</span></div>`;

  if (rd) return head + postRound(rd, live);

  if (live) return head + `
  <div class="list">${LIVE.prizes.map(p=>`
    <div class="row"><span class="main">
      <span class="nm" style="font-size:13.5px">${esc(p.prize)}
        <span style="color:${p.carry?'var(--faint)':'var(--live)'};font-weight:600;font-size:10px;letter-spacing:.05em">${p.carry?'CARRIES':'LEADING'}</span></span>
      ${p.leaders.length>1?`<span class="shared">Tied ${p.leaders.length} ways, ${money(Math.floor(p.amount/p.leaders.length))} each</span>`:''}
      ${p.leaders.length ? p.leaders.map(x=>`<span class="wl">${chipHTML(x.abbr)}
          <b>${esc(x.owner)}</b><span>${esc(x.why)}</span></span>`).join('')
        : `<span class="sub">${p.note ? esc(p.note) : 'Nothing qualifies yet'}</span>`}</span>
      <span class="amt" style="color:${p.carry?'var(--faint)':'var(--live)'}">${money(p.amount)}<small>${p.carry?'carries forward':'not yet paid'}</small></span></div>`).join('')}
    <div class="row"><span class="main"><span class="nm" style="font-size:13px;color:var(--dim)">Win bounty so far</span>
      <span class="sub">${money(100)} per win, ${LIVE.gamesFinal} games final</span></span>
      <span class="amt" style="color:var(--live)">${money(LIVE.bounty)}</span></div></div>
  <div class="foot">Leaders update as games finish, but nothing is paid and nothing counts in the standings until every game in the week is final.</div>`;

  return head + `
  <div class="list">${ORDER7.map(p=>{
    const l = wk.find(x=>x.prize===p);
    if(!l) return `<div class="row"><span class="main">
        <span class="nm" style="font-size:13.5px;color:var(--dim)">${esc(p)}</span>
        <span class="sub">No winner this week, money carries forward</span></span>
        <span class="amt" style="color:var(--faint)">carried</span></div>`;
    return `<div class="row"><span class="main">
      <span class="nm" style="font-size:13.5px">${esc(p)}</span>
      ${l.split?`<span class="shared">Shared ${l.winners.length} ways</span>`:''}
      ${winnerLines(l,true)}</span>
      <span class="amt g">${money(l.amount)}</span></div>`;
  }).join('')}
  <div class="row"><span class="main"><span class="nm" style="font-size:13px;color:var(--dim)">Week ${w} total</span></span>
    <span class="amt">${money(total)}</span></div></div>
  <div class="foot">Seven prizes every week, ${money(3800)} in total. A week can pay more than that when a prize carried in from an earlier week, which is why Price Check and Upset sometimes look large.</div>`;
}

/* One playoff round: every game in it, and what each knocked-out team earned
   its owner. The ladder is the only thing being played for here, since the
   seven weekly prizes stop at Week 18. */
function postRound(r, live){
  const kick = g => g.kick ? kickText(g.kick) : 'Kickoff to be set';
  /* A score only exists once a game is final. Showing one before that would
     be inventing a result. */
  const side = (abbr, score, final, won) => `<span style="display:inline-flex;align-items:center;gap:6px">
      ${chipHTML(abbr)}<b style="font-family:var(--mono);font-size:13px;font-weight:${won?600:400};
        color:${won?'var(--tx)':'var(--dim)'};min-width:18px;display:inline-block">${
        final && score !== null && score !== undefined ? score : ''}</b></span>`;

  const SB = r.week === 22;
  const stake = SB ? r.champion : r.perTeam;

  const html = `
  <div class="list">${r.games.map(g=>{
    const paid = g.pays.reduce((s,p)=>s+p.amount,0);
    return `<div class="row"><span class="main">
      <span class="nm" style="font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        ${side(g.away, g.aScore, g.final, g.final && g.winner===g.away)}
        <span style="color:var(--faint);font-weight:400;font-size:11.5px">at</span>
        ${side(g.home, g.hScore, g.final, g.final && g.winner===g.home)}</span>
      ${g.final
        ? g.pays.map(p=>`<span class="wl">${chipHTML(p.team)}
            <b>${esc((TEAM[p.team]||{}).owner || '')}</b>
            <span class="amt2">${money(p.amount)}</span>
            <span>${esc(p.why)}</span></span>`).join('')
        : `<span class="sub">${esc(kick(g))}${SB
            ? ', ' + money(r.perTeam) + ' to the runner-up' : ''}</span>`}</span>
      <span class="amt ${g.final && r.settled ? 'g' : ''}" style="${
        g.final && r.settled ? '' : 'color:var(--live)'}">${
        g.final ? money(paid) : money(stake)}<small>${
        g.final ? (r.settled ? '' : 'not yet paid')
                : (SB ? 'to the winner' : 'to the loser')}</small></span></div>`;
  }).join('')}
  <div class="row"><span class="main"><span class="nm" style="font-size:13px;color:var(--dim)">${
    esc(r.label)} round total</span></span>
    <span class="amt">${money(r.settled ? r.paid : r.amount)}</span></div></div>`;
  const T = DATA.postTiers || {};
  return html + `
  <div class="foot">${r.settled
    ? `The ${esc(r.label)} round is settled and paid.`
    : `Nothing in this round pays until every game in it is final, the same rule the regular weeks follow.`}
  The ladder pays fourteen teams in all: <b>${money(T.champion)}</b> to the champion,
  <b>${money(T['22'])}</b> to the runner-up, <b>${money(T['21'])}</b> to each conference loser,
  <b>${money(T['20'])}</b> to each divisional loser and <b>${money(T['19'])}</b> to each wild card
  loser. That is the ${money(DATA.postPool)} postseason pool${DATA.postRolled
    ? `, which includes <b>${money(DATA.postRolled)}</b> swept in at the end of Week 18: ${[
        DATA.postFromNovelty ? `${money(DATA.postFromNovelty)} of novelty prizes that were never triggered` : '',
        DATA.postFromWeekly ? `${money(DATA.postFromWeekly)} of weekly prize money that could not be awarded` : ''
      ].filter(Boolean).join(' and ')}. It pays on these same percentages rather than going unclaimed`
    : ', forty per cent of the whole pot'}.</div>`;
}

/* The rule behind each prize, so nobody has to open the rule book. Wording
   condensed from the published rules; the amount, how it is decided, and how
   a tie resolves. */
const RULE = {
 'Team of the Week': ['$11 every week.',
   'The largest margin of victory in any game that week, paid to the winning team&rsquo;s owner.',
   'A tie splits to the cent.'],
 'Stinker of the Week': ['$8 every week.',
   'The fewest points scored by a team that lost. Only losing teams are eligible, so a tie game has no Stinker.',
   'A tie splits to the cent.'],
 'Price Check': ['$8 every week.',
   'A team that beats an opponent who cost more at the auction, largest price gap wins. If no cheaper team wins outright, the money carries into the next week&rsquo;s Price Check and nowhere else.',
   'A tie splits to the cent.'],
 'Upset of the Week': ['$5 every week.',
   'A team that beats an opponent carrying a better record into that week, largest gap in win percentage wins. Week 1 never awards, because everyone is 0-0, so it carries into Week 2.',
   'A tie splits to the cent.'],
 'Shootout': ['$3 every week.',
   'The week&rsquo;s highest combined score. Both teams in that game split it, winner and loser alike, so this one always pays two owners.',
   'If two games tie on combined score, all four teams split it.'],
 'Most Field Goals': ['$2 every week.',
   'The most field goals made by a team in its game that week. Ties break on total field goal yardage.',
   'If still level, it splits to the cent.'],
 'Longest TD': ['$1 every week.',
   'The longest touchdown play by yards, any type, including defensive and special teams returns.',
   'A tie splits to the cent.'],
 'Mini-Season 1': ['$49, after Week 6.',
   'The best combined win percentage across all your teams over Weeks 1 to 6. A tie counts as half a win. Level owners go to total wins, then to the better average point differential per game.',
   'If still level, it splits to the cent.'],
 'Mini-Season 2': ['$54, after Week 12.',
   'The best combined win percentage across all your teams over Weeks 7 to 12. Nothing carries over from the first segment, so a bad start never eliminates anyone.',
   'Level owners go to total wins, then average point differential per game, then it splits to the cent.'],
 'Mini-Season 3': ['$66, after Week 18.',
   'The best combined win percentage across all your teams over Weeks 13 to 18. The largest of the three segment titles, and the last thing decided before the playoffs.',
   'Level owners go to total wins, then average point differential per game, then it splits to the cent.'],
 'Highest single-game score': ['$101, after Week 18.',
   'The most points scored by one team in one game across the whole regular season, paid to that team&rsquo;s owner.',
   'A tie splits to the cent.'],
 'Bottom of the Barrel': ['$72, after Week 18.',
   'The worst regular season record in the league. Ties break on point differential.',
   'If still level, it splits to the cent.'],
 'The Pink Slip': ['$101, once.',
   'The first head coach fired or mutually parted with, from Week 1 kickoff to the end of Week 18. The clock is the earlier of the team&rsquo;s announcement or the first credible national report.',
   'Same-day firings split it.'],
 'QB Down': ['$101, once.',
   'The first starting quarterback ruled out for the season, from Week 1 kickoff to the end of Week 18. Entered by hand once the team confirms it.',
   'Same-day rulings split it.'],
 'Postseason ladder': ['$1,000, paid round by round.',
   'Every one of the fourteen playoff teams pays its owner for the round it goes out in: $250 to the champion, $140 to the runner-up, $100 to each conference loser, $65 to each divisional loser, $25 to each wild card loser.',
   'A round pays only once every game in it is final. No ties are possible, so nothing splits.']
};

/* ---------------------------------------------------------------- prizes */
function prizeNames(){
  const seen = [...new Set(DATA.ledger.map(l=>l.prize))];
  return ORDER7.filter(p=>seen.includes(p))
    .concat(seen.filter(p=>!ORDER7.includes(p)).sort());
}

function prizePanel(){
  if (PRE) return `
    <div class="sec"><h2>Every prize</h2><span class="note">${money(M.pot)}</span></div>
    <div class="list">${DATA.pending.map(p=>`
      <div class="row"><span class="main">
        <span class="nm" style="font-size:13.5px">${esc(p.prize)}</span>
        <span class="sub">${esc(p.note)}</span></span>
        <span class="amt">${money(p.amount)}<small>${esc(p.when)}</small></span></div>`).join('')}
      <div class="row"><span class="main">
        <span class="nm" style="font-size:13.5px">Weekly prizes</span>
        <span class="sub">Seven every week, ${money(3800)} a week, Weeks 1 through 18</span></span>
        <span class="amt">${money(M.weeklyLeft)}<small>Every week</small></span></div>
      <div class="row"><span class="main">
        <span class="nm" style="font-size:13.5px">Win bounty</span>
        <span class="sub">${money(100)} for every regular season win by a team you own</span></span>
        <span class="amt">${money(M.bountyLeft)}<small>Every week</small></span></div></div>
    <div class="foot">Every dollar of the ${money(M.pot)} pot and how it gets won. Nothing has been decided yet. Once Week 1 is final this splits into what has been awarded and what is still to come.</div>`;

  const NAMES = prizeNames();
  const seg = `
    <div class="segbar">
      <button class="pill" data-mode="awarded" aria-pressed="${state.prizeMode==='awarded'}">Awarded</button>
      <button class="pill" data-mode="pending" aria-pressed="${state.prizeMode==='pending'}">Not yet decided</button>
    </div>`;

  if (state.prizeMode === 'pending' || !NAMES.length){
    return seg + `
    <div class="sec"><h2>Still to come</h2><span class="note">${money(DATA.pending.reduce((s,p)=>s+p.amount,0))}</span></div>
    <div class="list">${DATA.pending.map(p=>`
      <div class="row"><span class="main">
        <span class="nm" style="font-size:13.5px">${esc(p.prize)}</span>
        <span class="sub">${esc(p.note)}</span>
        <span class="sub" style="color:var(--tx)">Leader: ${esc(p.lead)}</span></span>
        <span class="amt">${money(p.amount)}<small>${esc(p.when)}</small></span></div>`).join('')}</div>
    <div class="foot">${[
        M.weeklyLeft ? `<b>${money(M.weeklyLeft)}</b> of weekly prizes` : '',
        M.bountyLeft ? `<b>${money(M.bountyLeft)}</b> of win bounty` : ''
      ].filter(Boolean).join(' and ')
      ? 'Plus ' + [M.weeklyLeft ? `<b>${money(M.weeklyLeft)}</b> of weekly prizes` : '',
                   M.bountyLeft ? `<b>${money(M.bountyLeft)}</b> of win bounty` : '']
                  .filter(Boolean).join(' and ') + ' still to be played for. That is '
      : 'That is '}${money(M.pot - M.awarded)} unclaimed in total, which ties to the bar at the top.</div>`;
  }

  if (!NAMES.includes(state.prize)) state.prize = NAMES[0];
  const rows = DATA.ledger.filter(l=>l.prize===state.prize).sort((a,b)=>a.week-b.week);
  const tot = rows.reduce((s,l)=>s+l.amount,0);
  const rule = RULE[state.prize];
  return seg + `
  <div class="segbar">${NAMES.map(n=>
    `<button class="pill mini" data-prize="${esc(n)}" aria-pressed="${n===state.prize}">${esc(n)}</button>`).join('')}</div>
  <div class="sec"><h2>${esc(state.prize)}</h2><span class="note">${money(tot)} paid</span></div>
  <div class="list">${rows.map(l=>`
    <div class="row">${rankCell(l.week)}
      <span class="main">${l.split?`<span class="shared">Shared ${l.winners.length} ways</span>`:''}
        ${winnerLines(l,true)}</span>
      <span class="amt g">${money(l.amount)}</span></div>`).join('')}</div>
  ${msWorking(state.prize)}
  ${rule ? `<div class="foot"><b>${rule[0]}</b> ${rule[1]} ${rule[2]}</div>` : ''}`;
}

/* the full mini-season working, so the winning number can be checked by hand */
function msWorking(prize){
  const t = (DATA.msTables || {})[prize];
  if (!t || !t.rows) return '';
  const span = t.final ? `Weeks ${t.lo} to ${t.hi}` : `Weeks ${t.lo} to ${t.thru}, in progress`;
  return `
  <div class="sec"><h2>How it was decided</h2><span class="note">${span}</span></div>
  <div class="tw"><table>
    <thead><tr><th>Owner</th><th>Teams</th><th>Games</th><th>W-L</th><th>Diff/G</th><th>Win %</th></tr></thead>
    <tbody>${t.rows.map((r,i)=>`<tr>
      <td style="${i===0?'font-weight:600':'color:var(--dim)'}">${esc(r.owner)}</td>
      <td class="num" style="color:var(--dim)">${r.teams}</td>
      <td class="num" style="color:var(--dim)">${r.g}</td>
      <td class="num" style="color:var(--dim)">${r.w}-${r.l}${r.t?'-'+r.t:''}</td>
      <td class="num" style="color:var(--dim)">${r.diff>0?'+':''}${r.diff.toFixed(1)}</td>
      <td class="num ${i===0?'g':''}">${r.pct.toFixed(3).replace(/^0/,'')}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

/* ---------------------------------------------------------------- teams */
function teamPanel(){
  const S = {
    price:(a,b)=>b.price-a.price,
    earned:(a,b)=>b.earned-a.earned,
    record:(a,b)=>b.w-a.w || (b.pf-b.pa)-(a.pf-a.pa),
    value:(a,b)=>(b.earned/b.price)-(a.earned/a.price)
  };
  const rows = [...DATA.teams].sort(S[state.sort]);
  return `
  <div class="sec"><h2>All 32 teams</h2><span class="note">${money(M.auctionSpend)} spent</span></div>
  <div class="tw"><table>
    <thead><tr>
      <th>Team</th><th>Owner</th>
      <th class="s" data-sort="record" data-on="${state.sort==='record'?1:0}">Rec</th>
      <th class="s" data-sort="price" data-on="${state.sort==='price'?1:0}">Paid</th>
      <th class="s" data-sort="earned" data-on="${state.sort==='earned'?1:0}">Won</th>
      <th class="s" data-sort="value" data-on="${state.sort==='value'?1:0}">Per $</th>
    </tr></thead>
    <tbody>${rows.map(t=>`<tr>
      <td>${chipHTML(t.abbr)} <span style="color:var(--dim);font-size:12px">${esc(t.name.split(' ').pop())}</span></td>
      <td style="color:var(--dim)">${esc(t.owner)}</td>
      <td class="num" style="color:var(--dim)">${t.w}-${t.l}${t.t?'-'+t.t:''}</td>
      <td class="num">${money(t.price)}</td>
      <td class="num g">${money(t.earned)}</td>
      <td class="num" style="color:var(--dim)">${(t.earned/t.price).toFixed(2)}</td>
    </tr>`).join('')}</tbody>
  </table></div>
  <div class="foot">Per $ is dollars won for every dollar paid at auction. <b>It will be the most argued-about number in the league.</b> ${money(M.forfeited)} of the ${money(M.pot)} went unspent at auction and was forfeited to the pot under the full-spend rule, which is why the prices only add to ${money(M.auctionSpend)}.</div>`;
}

/* ---------------------------------------------------------------- render */
const PANEL = {stand:standings, owner:ownerPanel, week:weekPanel,
               prize:prizePanel, team:teamPanel};

/* Rebuilding a panel throws away the horizontal scroll on its picker ribbons,
   which snaps you back to the first name or Week 1 the moment you tap something
   near the end. Save each ribbon's position and put it back. */
function render(tab = state.tab, reveal = false){
  const el = $('#p-'+tab);
  const was = [...el.querySelectorAll('.segbar')].map(s=>s.scrollLeft);
  el.innerHTML = PANEL[tab]();
  el.querySelectorAll('.segbar').forEach((s,i)=>{
    if (was[i]) s.scrollLeft = was[i];
  });
  /* Arriving at a tab, bring the selected pill into view: a late week or a
     name near the end of the standings is otherwise off-screen. Only on
     arrival, never when tapping within the ribbon, which must hold still. */
  if (reveal) el.querySelectorAll('.segbar').forEach(sb=>{
    const on = sb.querySelector('[aria-pressed="true"]'); if (!on) return;
    const l = on.offsetLeft, r = l + on.offsetWidth;
    if (l < sb.scrollLeft + 8 || r > sb.scrollLeft + sb.clientWidth - 8)
      sb.scrollLeft = Math.max(0, l - (sb.clientWidth - on.offsetWidth)/2);
  });
}
const renderAll = () => Object.keys(PANEL).forEach(t => render(t));

/* ---------------------------------------------------------------- nav */
const TABS = [
  ['stand','Standings','M3 13h4v8H3zM10 3h4v18h-4zM17 9h4v12h-4z'],
  ['owner','Owner','M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1'],
  ['week','This Week','M4 5h16v16H4zM4 10h16M9 3v4M15 3v4'],
  ['prize','Prizes','M8 4h8v4a4 4 0 0 1-8 0zM12 12v4M9 20h6M5 5h3M16 5h3'],
  ['team','Teams','M12 3l7 4v5c0 4-3 7.5-7 9-4-1.5-7-5-7-9V7z']
];
function go(tab){
  state.tab = tab;
  document.querySelectorAll('#nav button').forEach(b=>
    b.setAttribute('aria-selected', b.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(p=>
    p.classList.toggle('on', p.id === 'p-'+tab));
  render(tab, true);
  window.scrollTo({top:0});
}

document.addEventListener('click', e=>{
  if (!DATA) return;
  const t = e.target;
  const n = t.closest('#nav button[data-tab]');
  if (n){ go(n.dataset.tab); return; }
  const o = t.closest('[data-owner]');
  if (o){ state.me = o.dataset.owner; render(); return; }
  const g = t.closest('[data-goowner]');
  if (g){ state.me = g.dataset.goowner; go('owner'); return; }
  const w = t.closest('[data-week]');
  if (w){ state.week = +w.dataset.week; render(); return; }
  const p = t.closest('[data-prize]');
  if (p){ state.prize = p.dataset.prize; render(); return; }
  const m = t.closest('[data-mode]');
  if (m){ state.prizeMode = m.dataset.mode; render(); return; }
  const s = t.closest('[data-sort]');
  if (s){ state.sort = s.dataset.sort; render(); return; }
});

/* ---------------------------------------------------------------- data */
/* One fetch of one file. The pipeline rewrites data/board.json after games;
   this page only ever reads it. Cache-busted so a refresh really refreshes. */
async function fetchBoard(){
  const r = await fetch('data/board.json?t=' + Date.now(), {cache:'no-store'});
  if (!r.ok) throw new Error('board.json returned ' + r.status);
  return r.json();
}

function adopt(board, first){
  DATA = board;
  LIVE = board.liveWeek || null;
  M    = board.meta;
  /* PRE: the season has not started at all. Week 1 Thursday night is week 0
     AND live at the same time, so throughWeek alone is not the test.
     ZERO: games have been played but nobody has won anything yet, which is
     only about how the standings are ordered. */
  PRE  = board.throughWeek === 0 && !board.isLive;
  ZERO = M.awarded === 0;
  TEAM = Object.fromEntries(board.teams.map(t=>[t.abbr,t]));
  OWNERS = board.owners.map(o=>o.name);

  if (first || !OWNERS.includes(state.me)){
    /* Owner tab opens on whoever leads. No saved preference: one tap changes
       it, and nothing sticks to the wrong person. */
    state.me = ZERO
      ? [...board.owners].sort((a,b)=>a.name.localeCompare(b.name))[0].name
      : [...board.owners].sort((a,b)=>b.won-a.won)[0].name;
  }
  const last = (board.isLive && LIVE) ? LIVE.week : board.throughWeek;
  if (first || state.week > last) state.week = Math.max(1, last);
  if (first) state.prizeMode = board.ledger.length ? 'awarded' : 'pending';

  /* The ladder's own rule line has to quote the real pool, because untriggered
     novelty money moves into it at the end of Week 18 and every tier grows. */
  const T = board.postTiers || {};
  if (T.champion) RULE['Postseason ladder'] = [
    `${money(board.postPool)}, paid round by round.`,
    `Every one of the fourteen playoff teams pays its owner for the round it goes out in: `
      + `${money(T.champion)} to the champion, ${money(T['22'])} to the runner-up, `
      + `${money(T['21'])} to each conference loser, ${money(T['20'])} to each divisional loser, `
      + `${money(T['19'])} to each wild card loser.`
      + (board.postRolled ? ` The pool grew by ${money(board.postRolled)} at the end of Week 18,
         because that much prize money could not be awarded where it started and the rules send it
         here rather than letting it go unclaimed.` : ''),
    'A round pays only once every game in it is final. No ties are possible, so nothing splits.'];

  drawHeader();
  renderAll();
}

let lastLoad = 0;
async function boot(){
  try {
    const board = await fetchBoard();
    lastLoad = Date.now();
    $('#nav').innerHTML = TABS.map(([id,label,d])=>
      `<button data-tab="${id}" aria-selected="${id===state.tab}">
         <svg viewBox="0 0 24 24"><path d="${d}"/></svg>${label}</button>`).join('');
    adopt(board, true);
    $('#boot').style.display = 'none';
    $('#app').style.display = 'flex';
  } catch (err){
    $('#boot').innerHTML = `<div class="bootmsg">
      <h1>The board could not load</h1>
      <p>${esc(err.message)}</p>
      <p class="q">This usually means the pipeline has not finished writing
      <code>data/board.json</code> yet. Pull down to refresh in a minute.</p></div>`;
  }
}

/* Coming back to an open tab after a while, quietly pick up whatever the
   pipeline has written since. No spinner, no scroll jump. */
document.addEventListener('visibilitychange', async ()=>{
  if (document.hidden || !DATA || Date.now() - lastLoad < 60000) return;
  try {
    const board = await fetchBoard();
    lastLoad = Date.now();
    if (board.generated !== DATA.generated) adopt(board, false);
  } catch (e){ /* offline is not an error worth shouting about */ }
});

boot();

</script>
</body>
</html>
